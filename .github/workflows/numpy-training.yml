name: NumPy training compatibility
on:
  pull_request:
    paths:
      - 'requirements*.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - 'lzero/**'
      - 'zoo/classic_control/**'
      - 'tests/test_numpy_training_compatibility.py'
      - '.github/workflows/numpy-training.yml'
  workflow_dispatch:
jobs:
  training:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            numpy: 'numpy==1.26.4'
          - python: '3.11'
            numpy: 'numpy>=2,<3'
          - python: '3.12'
            numpy: 'numpy>=2,<3'
    env:
      OMP_NUM_THREADS: '1'
      SDL_VIDEODRIVER: dummy
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Install CPU PyTorch
        run: python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Install the full dependency stack and build extensions
        run: python -m pip install -e . '${{ matrix.numpy }}' pytest-timeout 'opencv-python-headless>=4.10'
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Record resolved versions
        run: python -m pip freeze
      - name: Exercise environments, replay, search and a learner update
        run: >-
          python -m pytest -q tests/test_numpy_training_compatibility.py
          lzero/mcts/tests/test_game_buffer_index_alignment.py
          lzero/worker/tests/test_muzero_evaluator.py
          zoo/minigrid/tests/test_minigrid_muzero_rnd.py
